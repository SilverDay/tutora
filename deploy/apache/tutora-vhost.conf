# Tutora production vhost — template rendered by deploy/install.sh (@DOMAIN@, @TLS_CERT@,
# @TLS_KEY@, @RELEASE_ROOT@). Requires mod_ssl, mod_proxy, mod_proxy_http, mod_proxy_wstunnel,
# mod_proxy_fcgi, mod_setenvif, mod_headers, mod_rewrite and php8.3-fpm.

# Port 80: ACME HTTP-01 challenges (certbot webroot) and a redirect to HTTPS, nothing else.
<VirtualHost *:80>
    ServerName @DOMAIN@
    DocumentRoot /var/www/letsencrypt
    <Directory /var/www/letsencrypt>
        Require all granted
        Options -Indexes
        AllowOverride None
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://@DOMAIN@%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName @DOMAIN@
    DocumentRoot @RELEASE_ROOT@/app/public

    SSLEngine on
    SSLCertificateFile    @TLS_CERT@
    SSLCertificateKeyFile @TLS_KEY@
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    SSLSessionTickets off

    <Directory @RELEASE_ROOT@/app/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    # PHP via php8.3-fpm (www-data); security headers (CSP, HSTS, ...) are set by the app
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Realtime relay: WebSocket upgrade on /ws -> Go relay on loopback only.
    # The connection token is sent in the first WebSocket message, never in the URL,
    # so access logs cannot capture it (spec: Realtime Protocol, option b).
    ProxyRequests Off
    ProxyPreserveHost On
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws$ ws://127.0.0.1:8090/ws [P,L]
    ProxyPass        /ws http://127.0.0.1:8090/ws
    ProxyPassReverse /ws http://127.0.0.1:8090/ws

    # Whiteboard sidecar (Yjs): WebSocket upgrade on /wb -> Node sidecar on loopback only
    # (default WHITEBOARD_URL). Token also in the first message, never in the URL.
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/wb$ ws://127.0.0.1:8091/wb [P,L]
    ProxyPass        /wb http://127.0.0.1:8091/wb
    ProxyPassReverse /wb http://127.0.0.1:8091/wb

    # The internal APIs (relay 127.0.0.1:8081, sidecar 127.0.0.1:8082) are never proxied.
    <Location /internal>
        Require all denied
    </Location>
</VirtualHost>
