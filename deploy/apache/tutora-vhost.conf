# Tutora production vhost (excerpt). Follows the create-apache-vhost.sh conventions of the
# target host; only the Tutora-specific parts are shown. Requires mod_proxy, mod_proxy_http,
# mod_proxy_wstunnel, mod_headers, mod_rewrite, mod_ssl.
<VirtualHost *:443>
    ServerName tutora.app
    DocumentRoot /var/www/tutora/app/public

    SSLEngine on
    # SSLCertificateFile / SSLCertificateKeyFile: host-managed certificate

    <Directory /var/www/tutora/app/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Realtime relay: WebSocket upgrade on /ws -> Go relay on loopback only.
    # The connection token is sent in the first WebSocket message, never in the URL,
    # so access logs cannot capture it (spec: Realtime Protocol, option b).
    ProxyRequests Off
    ProxyPreserveHost On
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws$ ws://127.0.0.1:8090/ws [P,L]
    ProxyPass        /ws http://127.0.0.1:8090/ws
    ProxyPassReverse /ws http://127.0.0.1:8090/ws

    # The relay's internal API (127.0.0.1:8081) is never proxied.
    <Location /internal>
        Require all denied
    </Location>
</VirtualHost>
